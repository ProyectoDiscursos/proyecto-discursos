<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Explorar | Proyecto Discursos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <header class="navbar" id="top">

        <a class="logo" href="index.html">
            Proyecto Discursos
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="explorar.html">Explorar</a>
            <a href="colecciones.html">Colecciones</a>
        </nav>

    </header>

    <main class="pagina-explorar">

        <section id="explorar">

            <h1>Explorar el archivo</h1>

            <section class="buscador-archivo">

                <label for="buscar-discursos">
                    Buscar en el archivo
                </label>

                <input
                    id="buscar-discursos"
                    type="search"
                    placeholder="Título, lugar, año, colección..."
                    autocomplete="off"
                >

                <p id="cantidad-resultados"></p>

                <div class="filtros-archivo">

                    <select id="filtro-anio">
                        <option value="">Todos los años</option>
                    </select>

                    <select id="filtro-pais">
                        <option value="">Todos los países</option>
                    </select>

                    <select id="filtro-provincia">
                        <option value="">Todas las provincias</option>
                    </select>

                    <select id="filtro-localidad">
                        <option value="">Todas las localidades</option>
                    </select>

                    <select id="filtro-lugar-especifico">
                        <option value="">Todos los lugares específicos</option>
                    </select>

                    <div class="separador-filtros"></div>

                    <select id="filtro-coleccion">
                        <option value="">Todas las colecciones</option>
                    </select>

                    <select id="orden-discursos">
                        <option value="recientes">Más recientes</option>
                        <option value="antiguos">Más antiguos</option>
                        <option value="az">Título: A–Z</option>
                        <option value="za">Título: Z–A</option>
                    </select>

                    <select id="filtro-estado">
                        <option value="">Todos los estados</option>
                    </select>

                    <button id="limpiar-filtros" type="button">
                        Limpiar filtros
                    </button>

                </div>

            </section>

            <div
                id="discursos"
                class="cards grid-discursos"
            ></div>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
