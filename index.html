
<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Proyecto Discursos</title>

<style>

body{
background:#141414;
font-family:Arial;
margin:0;
color:white;
}

header{

background:#000;

padding:20px;

font-size:32px;

font-weight:bold;

color:#e50914;

}

.container{

padding:30px;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(250px,1fr));

gap:20px;

}

.card{

background:#222;

border-radius:10px;

overflow:hidden;

transition:.3s;

cursor:pointer;

}

.card:hover{

transform:scale(1.05);

}

.card img{

width:100%;

display:block;

}

.info{

padding:15px;

}

</style>

</head>

<body>

<header>

Proyecto Discursos

</header>

<div class="container">

<h2>Últimos discursos</h2>

<div class="grid">

<div class="card">

<img src="https://picsum.photos/500/700">

<div class="info">

<h3>Apertura del Congreso 2013</h3>

<p>1 de marzo de 2013</p>

</div>

</div>

<div class="card">

<img src="https://picsum.photos/501/700">

<div class="info">

<h3>Cadena Nacional</h3>

<p>2014</p>

</div>

</div>

</div>

</div>

</body>
</html>
