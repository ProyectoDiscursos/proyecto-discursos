name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        run: |
          mkdir _site
          cp ./*.html _site/
          cp -r css _site/
          cp -r js _site/
          cp -r images _site/
          cp -r data _site/
          cp .nojekyll _site/

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4